<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraSphere Janzen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
/* 輪播外框 */
.carousel-wrap{
  width:100%;
  max-width:1200px;
  height:480px;
  margin:20px auto;
  overflow:hidden;
  position:relative;
}
.carousel-img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.4);
  color:#fff;
  border:none;
  font-size:28px;
  padding:8px 14px;
  cursor:pointer;
  z-index:10;
}
.prev{left:10px;}
.next{right:10px;}
.dots{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}
.dot{
  width:12px;height:12px;
  border-radius:50%;
  background:#ffffff77;
  cursor:pointer;
}
.dot.active{background:#fff;}
.contact-area{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
  font-size:17px;
  line-height:1.8;
}
</style>
</head>
<body>

<div class="carousel-wrap">
  <img id="slideImg" class="carousel-img" alt="輪播圖">
  <button class="arrow prev" id="btnPrev">&lt;</button>
  <button class="arrow next" id="btnNext">&gt;</button>
  <div class="dots" id="dotBox"></div>
</div>

<div class="contact-area">
  <h3>聯絡我們</h3>
  <p>電話：<a href="tel:+85291667683">+852 9166 7683</a></p>
  <p>Email：<a href="mailto:terrasphere.janzen@gmail.com">terrasphere.janzen@gmail.com</a></p>
</div>

<script>
// 圖片存放於網站根目錄，與index.html同一層
const slideImages = [
  "imagesppt-01.png",
  "imagesppt-02.png",
  "imagesppt-03.png",
  "imagesppt-04.png",
  "imagesppt-05.png",
  "imagesppt-06.png",
  "imagesppt-07.png",
  "imagesppt-08.png",
  "imagesppt-09.png",
  "imagesppt-10.png",
  "imagesppt-11.png",
  "imagesppt-12.png",
  "imagesppt-13.png",
  "imagesppt-14.png",
  "imagesppt-15.png"
];

let currentIndex = 0;
const slideImg = document.getElementById('slideImg');
const dotBox = document.getElementById('dotBox');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
let timer;

// 建立圓點指示器
slideImages.forEach((_,i)=>{
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goSlide(i);
  dotBox.appendChild(d);
})
const dots = document.querySelectorAll('.dot');

function render(){
  slideImg.src = slideImages[currentIndex];
  dots.forEach((d,i)=> d.classList.toggle('active',i===currentIndex));
}

function goSlide(idx){
  currentIndex = idx;
  render();
  resetTimer();
}

function nextSlide(){
  currentIndex = (currentIndex+1) % slideImages.length;
  render();
}
function prevSlide(){
  currentIndex = (currentIndex-1 + slideImages.length) % slideImages.length;
  render();
}

function startTimer(){
  timer = setInterval(nextSlide,4000); //4秒切換
}
function resetTimer(){
  clearInterval(timer);
  startTimer();
}

btnNext.onclick = ()=>{nextSlide();resetTimer();}
btnPrev.onclick = ()=>{prevSlide();resetTimer();}

// 初始化
render();
startTimer();
</script>
</body>
</html>
